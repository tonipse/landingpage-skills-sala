server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index karriere.html;

    location / {
        try_files $uri $uri/ /karriere.html;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
